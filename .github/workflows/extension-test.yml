name: Extension Test

on:
  push:
    branches:
      - main
    paths:
      - 'packages/vscode-codeurjc-slidev/**'
      # The live-link e2e drives the theme's inspection channel, so a change
      # there can break the extension without touching its package.
      - 'packages/codeurjc-slidev-theme/**'
      - tests/vscode-geometry-live-link.spec.ts

jobs:
  test-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:extension
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test:e2e:vscode
